<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MASSMAIL TRACKER — Command Center</title>
  <meta name="description" content="Real-time mass email sending tracker. Create campaigns, distribute mailto links, and track sends live.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- ─── PARTICLES BACKGROUND ─────────────────────────────────────────── -->
  <canvas id="particleCanvas"></canvas>

  <!-- ─── MAIN CONTAINER ───────────────────────────────────────────────── -->
  <div class="app-container">

    <!-- ─── HEADER ───────────────────────────────────────────────────────── -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg viewBox="0 0 40 40" fill="none">
            <rect x="2" y="2" width="36" height="36" rx="8" stroke="url(#logoGrad)" stroke-width="2.5"/>
            <path d="M10 28L20 14L30 28" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="20" cy="12" r="2.5" fill="url(#logoGrad)"/>
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="40" y2="40">
                <stop stop-color="#6366f1"/>
                <stop offset="1" stop-color="#a855f7"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <h1 class="logo-title">MASSMAIL<span class="accent">TRACKER</span></h1>
          <p class="logo-subtitle">Real-Time Email Campaign Intelligence</p>
        </div>
      </div>
      <div class="header-stats" id="headerStats">
        <div class="stat-chip">
          <span class="stat-chip-label">Campaigns</span>
          <span class="stat-chip-value" id="totalCampaigns">0</span>
        </div>
        <div class="stat-chip">
          <span class="stat-chip-label">Total Sent</span>
          <span class="stat-chip-value" id="totalEmailsSent">0</span>
        </div>
      </div>
    </header>

    <!-- ─── CREATE CAMPAIGN SECTION ──────────────────────────────────────── -->
    <section class="create-section">
      <div class="section-header" id="createToggle">
        <h2>
          <span class="section-icon">⚡</span>
          Create New Campaign
        </h2>
        <button class="toggle-btn" id="toggleBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>

      <form class="campaign-form" id="campaignForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="campaignName">Campaign Name</label>
            <input type="text" id="campaignName" placeholder="e.g., Product Launch Outreach" required>
          </div>
          <div class="form-group">
            <label for="recipientEmail">Recipient Email (TO field)</label>
            <input type="email" id="recipientEmail" placeholder="e.g., target@company.com" required>
          </div>
          <div class="form-group full-width">
            <label for="emailSubject">Email Subject Line</label>
            <input type="text" id="emailSubject" placeholder="e.g., Important: Request for Consideration" required>
          </div>
          <div class="form-group full-width">
            <label for="emailBody">Email Body</label>
            <textarea id="emailBody" rows="5" placeholder="Write the email content here. Keep it concise for mailto compatibility (under ~1800 chars)." required></textarea>
            <div class="char-counter"><span id="charCount">0</span> / 1800 characters</div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="createBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
          Create Campaign
        </button>
      </form>
    </section>

    <!-- ─── CAMPAIGNS LIST ───────────────────────────────────────────────── -->
    <section class="campaigns-section">
      <h2><span class="section-icon">📡</span> Active Campaigns</h2>
      <div class="campaigns-grid" id="campaignsGrid">
        <!-- Campaigns rendered here -->
      </div>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📭</div>
        <h3>No campaigns yet</h3>
        <p>Create your first campaign above to get started.</p>
      </div>
    </section>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
